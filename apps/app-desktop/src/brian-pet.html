<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'"
    />
    <meta name="color-scheme" content="dark" />
    <style>
      :root {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: grid;
        place-items: end center;
        padding: 6px;
      }

      button {
        position: relative;
        width: 138px;
        height: 142px;
        padding: 0;
        border: 0;
        outline: 0;
        color: #eaf5ff;
        background: transparent;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }

      .prompt {
        position: absolute;
        top: 1px;
        left: 50%;
        z-index: 2;
        padding: 7px 10px;
        border: 1px solid rgba(21, 213, 238, 0.68);
        border-radius: 8px;
        background: rgba(7, 22, 41, 0.94);
        box-shadow: 0 8px 22px rgba(3, 12, 27, 0.34);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.02em;
        white-space: nowrap;
        opacity: 0;
        transform: translate(-50%, 5px) scale(0.96);
        transition: opacity 130ms ease, transform 130ms ease;
      }

      .prompt::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -5px;
        width: 8px;
        height: 8px;
        border-right: 1px solid rgba(21, 213, 238, 0.68);
        border-bottom: 1px solid rgba(21, 213, 238, 0.68);
        background: #071629;
        transform: translateX(-50%) rotate(45deg);
      }

      button:hover .prompt,
      button:focus-visible .prompt {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }

      .pet {
        position: absolute;
        left: 17px;
        bottom: 5px;
        width: 104px;
        height: 104px;
        object-fit: contain;
        filter: drop-shadow(0 9px 10px rgba(0, 21, 40, 0.38));
      }

      .halo {
        position: absolute;
        left: 50%;
        bottom: 2px;
        width: 90px;
        height: 18px;
        border-radius: 50%;
        background: rgba(14, 210, 235, 0.18);
        filter: blur(8px);
        transform: translateX(-50%);
      }

    </style>
  </head>
  <body>
    <button id="message-brian" type="button" aria-label="Message Brian" title="Message Brian">
      <span class="prompt">Message Brian</span>
      <span class="halo" aria-hidden="true"></span>
      <img class="pet" src="./brian-logo.png" alt="" aria-hidden="true" />
    </button>
  </body>
</html>
