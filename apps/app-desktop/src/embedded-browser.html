<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brian Browser</title>
  <style>
    :root { color-scheme: light dark; --background: #fff; --sidebar: #f7f7f5; --foreground: #37352f; --muted: #787774; --border: #e9e9e7; --hover: #efefed; --primary: #2383e2; --selected: #eaf3fe; --danger: #b42318; --danger-bg: #fff0ee; }
    @media (prefers-color-scheme: dark) { :root { --background: #191919; --sidebar: #202020; --foreground: #d4d4d4; --muted: #9b9b9b; --border: #353535; --hover: #2c2c2c; --primary: #529cca; --selected: #203748; --danger: #ff9b92; --danger-bg: #3c2525; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--foreground); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
    header { height: 128px; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--border); background: var(--sidebar); display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; align-items: center; gap: 4px; min-height: 32px; }
    button, input { font: inherit; height: 32px; border: 1px solid transparent; border-radius: 6px; padding: 5px 8px; background: transparent; color: inherit; }
    button { cursor: pointer; white-space: nowrap; }
    button:hover:not(:disabled) { background: var(--hover); }
    button:active:not(:disabled) { background: var(--selected); }
    button:disabled { opacity: .4; cursor: default; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
    #stop { color: var(--danger); background: var(--danger-bg); font-size: 12px; font-weight: 600; }
    #stop:hover { border-color: var(--danger); }
    .icon-button { width: 32px; height: 32px; flex: 0 0 32px; display: inline-flex; align-items: center; justify-content: center; padding: 7px; color: var(--muted); }
    .icon-button svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    #status { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 500; color: var(--muted); }
    #address { flex: 1; min-width: 0; width: 0; background: var(--background); border-color: var(--border); }
    #address::placeholder { color: var(--muted); }
    #tabs { display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
    .tab { display: flex; flex-shrink: 0; align-items: center; border-radius: 6px; }
    .tab:has([aria-selected="true"]) { background: var(--selected); color: var(--primary); }
    .tab button:first-child { max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
    .tab button:last-child { width: 26px; padding: 4px; color: var(--muted); }
    #new { color: var(--muted); font-size: 12px; }
    [hidden] { display: none !important; }
    #separator { position: fixed; left: 0; top: 0; width: 8px; height: 100vh; cursor: ew-resize; touch-action: none; background: transparent; border-left: 1px solid var(--border); }
    #separator::after { content: ""; position: absolute; left: 2px; top: calc(50% - 18px); width: 3px; height: 36px; border-radius: 3px; background: var(--border); }
    #separator:hover::after, #separator:focus-visible::after { background: var(--primary); }
    #separator:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
    #rail { height: 100vh; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; background: var(--sidebar); border-left: 1px solid var(--border); }
    #rail .icon-button { width: 36px; height: 36px; flex-basis: 36px; }
    #expand { background: var(--background); border-color: var(--border); }
    #rail-stop { width: 42px; min-height: 44px; height: auto; padding: 5px 2px; white-space: normal; font-size: 11px; line-height: 15px; font-weight: 600; color: var(--danger); background: var(--danger-bg); }
    #rail-stop:hover { border-color: var(--danger); }
    #rail-detach { margin-top: auto; }
    main { padding: 48px 24px; color: var(--muted); text-align: center; font-size: 13px; }
  </style>
</head>
<body>
  <div id="separator" role="separator" aria-label="Browser panel width" aria-orientation="vertical" tabindex="0"></div>
  <aside id="rail" aria-label="Browser controls" hidden><button id="expand" class="icon-button" aria-label="Expand browser panel" title="Expand browser panel" aria-controls="controls" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/><path d="m10 9-3 3 3 3"/></svg></button><button id="rail-stop" title="Stop Brian">Stop Brian</button><button id="rail-detach" class="icon-button" aria-label="Detach browser window" title="Detach browser window"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 3h7v7m0-7-9 9M10 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></svg></button></aside>
  <header id="controls" aria-label="Trusted browser controls">
    <div class="row"><span id="status" role="status">Browser</span><button id="stop">Stop Brian</button><button id="detach" class="icon-button" aria-label="Detach browser window" title="Detach browser window"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 3h7v7m0-7-9 9M10 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></svg></button><button id="dock" class="icon-button" aria-label="Dock browser panel" title="Dock browser panel" hidden><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/><path d="m8 9 3 3-3 3"/></svg></button><button id="collapse" class="icon-button" aria-label="Collapse browser panel" title="Collapse browser panel" aria-controls="controls" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/><path d="m8 9 3 3-3 3"/></svg></button></div>
    <form id="navigation" class="row">
      <button type="button" id="back" class="icon-button" aria-label="Back" title="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h14"/></svg></button>
      <button type="button" id="forward" class="icon-button" aria-label="Forward" title="Forward"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 5 7 7-7 7M5 12h14"/></svg></button>
      <button type="button" id="reload" class="icon-button" aria-label="Reload" title="Reload"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2 5M20 12l-3-5"/></svg></button>
      <input id="address" aria-label="Website address" placeholder="example.com" autocomplete="off" spellcheck="false">
      <button type="submit" title="Go to address">Go</button>
    </form>
    <div class="row"><div id="tabs" role="tablist" aria-label="Tabs"></div><button id="new">+ New tab</button></div>
  </header>
  <main id="empty">Open a new tab or enter a website address.</main>
</body>
</html>
