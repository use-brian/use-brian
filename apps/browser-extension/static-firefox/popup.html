<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <style>
      /* Mirrors apps/app-web's default (Notion) palette so the extension reads
         as part of the product: warm-black ink, warm-grey surfaces, a neutral
         filled action, and the app's blue reserved for focus. */
      :root {
        color-scheme: light dark;
        --bg: #FFFFFF;
        --fg: #37352F;
        --muted: #787774;
        --faint: #A5A4A0;
        --surface: #F7F7F5;
        --hover: #EFEFEE;
        --border: #E9E9E7;
        --input: #E3E2E0;
        --ring: #2383E2;
        --action: #37352F;
        --action-fg: #FFFFFF;
        --danger: #EB5757;
        --danger-fg: #FFFFFF;
        --danger-soft: #FDEBEC;
        --ok: #0F7B6C;
        --warn-bg: #FBF3DB;
        --warn-border: #F1E0A9;
        --warn-fg: #6E5413;
        --radius: 10px;
        --radius-sm: 7px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #191919;
          --fg: #D4D4D4;
          --muted: #979797;
          --faint: #6F6F6F;
          --surface: #202020;
          --hover: #2A2A2A;
          --border: #2F2F2F;
          --input: #3A3A3A;
          --ring: #529CCA;
          --action: #D4D4D4;
          --action-fg: #191919;
          --danger: #E06B6B;
          --danger-fg: #191919;
          --danger-soft: #3A2224;
          --ok: #4DAB9A;
          --warn-bg: #3A3222;
          --warn-border: #574A2C;
          --warn-fg: #E8D3A2;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang TC", sans-serif; -webkit-font-smoothing: antialiased; }
      button { font: inherit; font-size: 12.5px; font-weight: 500; padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--input); background: var(--bg); color: var(--fg); cursor: pointer; transition: background-color 120ms, border-color 120ms, opacity 120ms; }
      button:hover { background: var(--hover); }
      button:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
      button:disabled { opacity: 0.45; cursor: default; }
      button.primary { background: var(--action); border-color: var(--action); color: var(--action-fg); }
      button.primary:hover { opacity: 0.88; background: var(--action); }
      button.danger { background: var(--danger); border-color: var(--danger); color: var(--danger-fg); }
      button.danger:hover { opacity: 0.9; background: var(--danger); }
      body { width: 340px; padding: 14px 14px 12px; }
      .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
      .mark { width: 28px; height: 28px; border-radius: 7px; image-rendering: pixelated; flex: none; }
      .title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; }
      .sub { color: var(--muted); font-size: 11.5px; line-height: 1.3; }
      .status { display: flex; align-items: flex-start; gap: 8px; padding: 9px 11px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); margin-bottom: 12px; }
      .status .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--faint); }
      .status.ready .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent); }
      .row { margin-bottom: 10px; }
      label { display: block; font-size: 12px; font-weight: 500; color: var(--fg); margin-bottom: 4px; }
      input:not([type="checkbox"]) { width: 100%; padding: 7px 10px; border: 1px solid var(--input); border-radius: var(--radius-sm); background: var(--bg); color: var(--fg); font: inherit; font-size: 12.5px; transition: border-color 120ms; }
      input:not([type="checkbox"])::placeholder { color: var(--faint); }
      input:not([type="checkbox"]):focus-visible { outline: none; border-color: var(--ring); box-shadow: none; }
      input[type="checkbox"] { width: 15px; height: 15px; margin: 2px 0 0; accent-color: var(--action); flex: none; }
      /* The pre-approval setting is an on/off preference, so it reads as a switch. */
      input[type="checkbox"].switch { appearance: none; -webkit-appearance: none; position: relative; width: 30px; height: 18px; margin: 1px 0 0; border-radius: 999px; background: var(--input); cursor: pointer; transition: background-color 150ms; }
      input[type="checkbox"].switch::before { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); transition: transform 150ms; }
      input[type="checkbox"].switch:checked { background: var(--action); }
      input[type="checkbox"].switch:checked::before { transform: translateX(12px); background: var(--action-fg); }
      input[type="checkbox"].switch:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
      input[type="checkbox"].switch:disabled { opacity: 0.5; cursor: default; }
      .toggle { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 10px 11px; border: 1px solid var(--border); border-radius: var(--radius); }
      .toggle label { margin: 0; cursor: pointer; }
      .toggle small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 400; line-height: 1.45; margin-top: 2px; }
      .actions { display: flex; gap: 6px; margin-top: 12px; }
      .actions .primary { flex: 1; }
      .actions .danger-quiet { margin-left: auto; }
      button.danger-quiet { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--input)); }
      button.danger-quiet:hover { background: var(--danger-soft); }
      .hint { color: var(--muted); font-size: 11.5px; line-height: 1.5; margin: 10px 0 0; }
      .warn { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-fg); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 12px; margin: 0 0 10px; }
      .divider { height: 1px; background: var(--border); border: 0; margin: 12px -14px; }
      .build { color: var(--faint); font-size: 10.5px; margin: 0; font-variant-numeric: tabular-nums; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    </style>
  </head>
  <body>
    <header class="head">
      <img class="mark" src="icon-32.png" alt="" />
      <div>
        <div class="title">Use Brian</div>
        <div class="sub">Browser agent</div>
      </div>
    </header>
    <div id="status" class="status"><span class="dot"></span><span id="status-text">Checking...</span></div>
    <div id="build-warning" class="warn" hidden></div>
    <div class="row" id="grant-row" hidden>
      <button id="grant" class="primary" style="width: 100%">Open Firefox setup</button>
    </div>
    <div class="row">
      <label for="relay-url">Relay URL</label>
      <input id="relay-url" placeholder="wss://relay.usebrian.ai/ext" />
    </div>
    <div class="row">
      <label for="pairing-token">Pairing token</label>
      <input id="pairing-token" placeholder="Paste from Settings > Browser extension" />
    </div>
    <div class="row toggle">
      <label for="preapprove-tab-control">
        Pre-approve tab control
        <small>Skip the Allow popup for eligible tabs. Stop still requires a fresh manual Allow.</small>
      </label>
      <input id="preapprove-tab-control" class="switch" type="checkbox" role="switch" />
    </div>
    <div class="actions">
      <button id="connect" class="primary">Connect</button>
      <button id="disconnect">Disconnect</button>
      <button id="stop" class="danger-quiet">Stop task</button>
    </div>
    <p class="hint">The assistant only acts within this browser profile's configured tab scope. Stop ends the current task immediately.</p>
    <hr class="divider" />
    <p class="build" id="build-line"></p>
    <script type="module" src="firefox-popup.js"></script>
  </body>
</html>
