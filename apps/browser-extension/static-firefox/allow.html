<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <style>
      /* Mirrors apps/app-web's default (Notion) palette so the extension reads
         as part of the product: warm-black ink, warm-grey surfaces, a neutral
         filled action, and the app's blue reserved for focus. */
      :root {
        color-scheme: light dark;
        --bg: #FFFFFF;
        --fg: #37352F;
        --muted: #787774;
        --faint: #A5A4A0;
        --surface: #F7F7F5;
        --hover: #EFEFEE;
        --border: #E9E9E7;
        --input: #E3E2E0;
        --ring: #2383E2;
        --action: #37352F;
        --action-fg: #FFFFFF;
        --danger: #EB5757;
        --danger-fg: #FFFFFF;
        --danger-soft: #FDEBEC;
        --ok: #0F7B6C;
        --warn-bg: #FBF3DB;
        --warn-border: #F1E0A9;
        --warn-fg: #6E5413;
        --radius: 10px;
        --radius-sm: 7px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #191919;
          --fg: #D4D4D4;
          --muted: #979797;
          --faint: #6F6F6F;
          --surface: #202020;
          --hover: #2A2A2A;
          --border: #2F2F2F;
          --input: #3A3A3A;
          --ring: #529CCA;
          --action: #D4D4D4;
          --action-fg: #191919;
          --danger: #E06B6B;
          --danger-fg: #191919;
          --danger-soft: #3A2224;
          --ok: #4DAB9A;
          --warn-bg: #3A3222;
          --warn-border: #574A2C;
          --warn-fg: #E8D3A2;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang TC", sans-serif; -webkit-font-smoothing: antialiased; }
      button { font: inherit; font-size: 12.5px; font-weight: 500; padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--input); background: var(--bg); color: var(--fg); cursor: pointer; transition: background-color 120ms, border-color 120ms, opacity 120ms; }
      button:hover { background: var(--hover); }
      button:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
      button:disabled { opacity: 0.45; cursor: default; }
      button.primary { background: var(--action); border-color: var(--action); color: var(--action-fg); }
      button.primary:hover { opacity: 0.88; background: var(--action); }
      button.danger { background: var(--danger); border-color: var(--danger); color: var(--danger-fg); }
      button.danger:hover { opacity: 0.9; background: var(--danger); }
      body { padding: 20px; }
      .head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      .mark { width: 28px; height: 28px; border-radius: 7px; image-rendering: pixelated; flex: none; }
      h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; margin: 0; }
      p { margin: 0 0 16px; color: var(--muted); }
      .actions { display: flex; gap: 8px; }
      button { padding: 8px 16px; font-size: 13px; }
    </style>
  </head>
  <body>
    <header class="head">
      <img class="mark" src="icon-32.png" alt="" />
      <h1>Allow Use Brian in this tab?</h1>
    </header>
    <p id="detail">Use Brian wants to work in this tab. You can watch it and stop at any time.</p>
    <div class="actions">
      <button id="allow" class="primary">Allow</button>
      <button id="deny">Deny</button>
    </div>
    <script type="module" src="firefox-allow.js"></script>
  </body>
</html>
