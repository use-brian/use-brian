# Build + test the open core on every PR and on pushes to main/develop. Build
# runs before typecheck because some script-level typechecks reference their
# package's built dist. The largest test suites run on isolated workers so
# Turbo's package fan-out cannot multiply Vitest's own worker fan-out on one
# runner. Credential-free database acceptance stays required; exhaustive
# historical upgrades run on database changes, nightly and manual dispatch.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '17 18 * * *' # 02:17 Asia/Singapore
  workflow_dispatch:
    inputs:
      compare_calendar_arm:
        description: Also benchmark the full Calendar recovery shard on ARM64
        type: boolean
        default: false

# A newer push to the same ref cancels an in-flight run. Push and PR refs differ,
# so the job guards below separately suppress the duplicate develop -> main run.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && 'manual' || 'change' }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-scope:
    if: &skip-duplicate-release-pr >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    outputs:
      historical: ${{ steps.scope.outputs.historical }}
      profile: ${{ steps.scope.outputs.profile }}
      shards: ${{ steps.scope.outputs.shards }}
      total: ${{ steps.scope.outputs.total }}
      matrix: ${{ steps.scope.outputs.matrix }}
      calendar: ${{ steps.scope.outputs.calendar }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check SQL migration sizes
        run: node scripts/hooks/check-migration-size.mjs --files
      - id: scope
        run: node scripts/testing/ci-scope.mjs
      - name: Retain proposed change impact (report-only)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-change-impact
          path: ${{ runner.temp }}/ci-change-impact.json
          if-no-files-found: warn

  # Calendar was the last suite in five measured runs. Let its own API test
  # dependency closure build independently of the shared package build.
  calendar-isolation:
    if: *skip-duplicate-release-pr
    needs: ci-scope
    name: Department isolation (${{ matrix.shard }}/${{ needs.ci-scope.outputs.total }})${{ matrix.labelSuffix }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci-scope.outputs.calendar) }}
    steps:
      - &isolation-checkout
        uses: actions/checkout@v4
      - &isolation-pnpm
        uses: pnpm/action-setup@v4
      - &isolation-node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - &isolation-postgres
        name: Install PostgreSQL 18 with required extensions
        if: needs.ci-scope.outputs.profile == 'current' || matrix.shard > 3
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          # Retry transient TLS/read failures with verification enabled.
          sudo curl --fail --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 180 \
            --connect-timeout 15 --max-time 60 \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-18-pgvector

      - &isolation-install
        name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Identify pristine Calendar database
        id: calendar_fixture
        continue-on-error: true
        if: &calendar-cache-event github.event_name == 'push' || github.event_name == 'pull_request'
        run: node scripts/crm/pristine-fixture.mjs --pg-bin /usr/lib/postgresql/18/bin
      - name: Cache pristine Calendar database
        continue-on-error: true
        if: *calendar-cache-event
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/calendar-pristine/${{ steps.calendar_fixture.outputs.key }}
          key: ${{ steps.calendar_fixture.outputs.key }}

      - name: Build Calendar test dependencies
        run: pnpm exec turbo run build --filter='@use-brian/api^...'

      - &isolation-acceptance
        name: Run no-credential acceptance
        run: >-
          node scripts/test-department-isolation.mjs
          --pg-bin /usr/lib/postgresql/18/bin
          --profile ${{ needs.ci-scope.outputs.profile }}
          --shard ${{ matrix.shard }}/${{ needs.ci-scope.outputs.total }}
          --report /tmp/department-isolation-${{ matrix.shard }}.json

      - &isolation-receipt
        name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: /tmp/department-isolation-${{ matrix.shard }}.json
          if-no-files-found: error

  database-test-dependencies:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package dependencies for database tests
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm exec turbo run build --filter='./packages/*'

      - name: Archive database test dependencies
        run: tar -czf "$RUNNER_TEMP/database-test-dependencies.tgz" packages/*/dist

      - name: Retain database test dependencies
        uses: actions/upload-artifact@v4
        with:
          name: database-test-dependencies-${{ github.sha }}
          path: ${{ runner.temp }}/database-test-dependencies.tgz
          if-no-files-found: error
          retention-days: 1

  build-typecheck:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused checks from source
        run: pnpm check:fast --all

      - name: Verify fast check selection and hook feedback
        run: node --test scripts/__tests__/run-fast-checks.test.mjs scripts/__tests__/after-edit-fast-checks.test.mjs

      - name: Verify canonical conversation migration source
        run: |
          node packages/api/scripts/conversation-store/build.mjs --check
          node packages/api/scripts/conversation-store/build-conversation-graph-set.mjs --check
          node packages/api/scripts/conversation-store/build-conversation-frontier.mjs --check
          node packages/api/scripts/conversation-store/build-conversation-memory-query-candidates.mjs --check

      # Clean API compilation can exceed 4 GiB; keep this a step-local build budget.
      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm build

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm typecheck

      # One end-to-end queryLoop turn against an in-memory mock provider.
      - name: Smoke
        run: pnpm smoke

      - name: Test build config and release-evidence checks
        run: >-
          node --test
          scripts/__tests__/api-build-config.test.mjs
          scripts/__tests__/test-evidence.test.mjs
          scripts/__tests__/department-isolation-report.test.mjs
          scripts/__tests__/ci-scope.test.mjs
          scripts/__tests__/migration-owner-groups.test.mjs
          scripts/__tests__/preflight-push.test.mjs
          scripts/__tests__/docker-build-closure.test.mjs
          scripts/__tests__/trigger-hosted-web-release.test.mjs

      # Discovery is report-only until complete journeys qualify ten candidates.
      # The required build-test gate depends on complete selected-scope coverage.
      - name: Inventory selected test files (report-only)
        continue-on-error: true
        run: node scripts/testing/inventory.mjs --report "$RUNNER_TEMP/test-inventory.json"

      - name: Retain test inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-file-inventory
          path: ${{ runner.temp }}/test-inventory.json
          if-no-files-found: warn

  api-tests:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: Unit tests (@use-brian/api ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build test dependencies
        run: pnpm exec turbo run build --filter="@use-brian/api^..."

      - name: Unit tests
        env:
          BRIAN_TEST_PARTITION: ordinary
        run: pnpm --filter @use-brian/api exec vitest run --shard=${{ matrix.shard }}

  app-web-tests:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: Unit tests (app-web ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build test dependencies
        run: pnpm exec turbo run build --filter="app-web^..."

      - name: Unit tests
        env:
          BRIAN_TEST_PARTITION: ordinary
        run: pnpm --filter app-web exec vitest run --shard=${{ matrix.shard }}

  offline-continuity:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: Offline and unstable-network continuity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build test dependencies
        run: pnpm exec turbo run build --filter="app-web^..."
      - name: Shared app continuity
        run: >-
          pnpm --filter app-web exec vitest run --maxWorkers=2
          src/lib/__tests__/app-session.test.ts
          src/components/__tests__/app-session.test.tsx
          src/components/context/__tests__/mode-aware-context.test.tsx
          src/components/chat-app/__tests__/chat-responsive-controls.test.tsx
          src/lib/__tests__/auth-fetch.test.ts
          desktop/__tests__/offline-bootstrap.test.ts
          src/lib/offline/__tests__/offline-pages.test.ts
          src/contexts/__tests__/primary-assistant-offline.test.tsx
          src/lib/offline/__tests__/durable-draft.test.tsx
          src/components/doc/__tests__/comment-thread-body-seed.test.tsx
          src/components/doc/__tests__/page-comments.test.tsx
          src/lib/offline/__tests__/metadata-recovery.test.ts
          src/lib/offline/__tests__/application-authority-cache.test.ts
          src/lib/recordings/__tests__/offline-media.test.ts
          src/lib/recordings/__tests__/upload-journal.test.ts
          src/lib/recordings/__tests__/upload-restart.test.ts
          src/lib/recordings/__tests__/use-recording-upload.test.tsx
          src/lib/recorder/__tests__/recorder-spool.test.ts
          src/lib/recorder/__tests__/dock-recorder-background.test.tsx
          src/lib/offline/__tests__/offline-writes.test.ts
          src/lib/offline/__tests__/use-offline-sync.test.ts
          src/lib/recorder/__tests__/recorder-engine-live.test.ts
          src/lib/recordings/__tests__/recording-player-context.test.tsx
          src/components/recordings/__tests__/recording-player-bar.test.tsx
      - name: Native shell continuity
        run: >-
          pnpm --filter @use-brian/app-desktop exec vitest run --maxWorkers=2
          src/__tests__/desktop-auth.test.ts
          src/__tests__/window-policy.test.ts
          src/__tests__/desktop-token-store.test.ts
          src/__tests__/desktop-packaging.test.ts

  heavyweight-tests:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: Unit tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - "@use-brian/core"
          - "@use-brian/app-desktop"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo builds this package's dependency closure before its test task.
      - name: Unit tests
        env:
          BRIAN_TEST_PARTITION: ordinary
        run: pnpm exec turbo run test --filter="${{ matrix.package }}"

  remaining-tests:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: Unit tests (remaining packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # These tests also compile the API through their transitive build graph.
      # Match the root unit command: hook subprocesses must not compete with
      # sibling package tests and compiler pools on the same runner.
      - name: Unit tests
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: >-
          pnpm exec turbo run test
          --filter='!@use-brian/api'
          --filter='!@use-brian/core'
          --filter='!app-web'
          --filter='!@use-brian/app-desktop'
          --filter='!@use-brian/api-open'
          --concurrency=1

  embedded-current-tests:
    needs: [ci-scope, database-test-dependencies]
    if: needs.ci-scope.outputs.historical == 'false'
    name: Embedded database current schema
    runs-on: ubuntu-latest
    # A fresh owner replay prepares the image before the current-schema tests.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download database test dependencies
        uses: actions/download-artifact@v4
        with:
          name: database-test-dependencies-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Restore database test dependencies
        run: tar -xzf "$RUNNER_TEMP/database-test-dependencies.tgz"

      - run: node scripts/testing/embedded-database-tests.mjs current
      - run: pnpm --filter @use-brian/api-open exec vitest run src/runtime.test.ts

  embedded-database-tests:
    needs: [ci-scope, database-test-dependencies]
    if: needs.ci-scope.outputs.historical == 'true'
    name: Embedded database tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full-chain replays need time for artifact restoration and migration.
          - { group: owner-legacy, timeoutMinutes: 25 }
          - { group: owner-fresh, timeoutMinutes: 15 }
          - { group: owner-cutover, timeoutMinutes: 15 }
          - { group: owner-successor, timeoutMinutes: 15 }
          - { group: owner-prerequisites, timeoutMinutes: 10 }
          - { group: session, timeoutMinutes: 15 }
          - { group: remaining, timeoutMinutes: 10 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download database test dependencies
        uses: actions/download-artifact@v4
        with:
          name: database-test-dependencies-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Restore database test dependencies
        run: tar -xzf "$RUNNER_TEMP/database-test-dependencies.tgz"

      - name: Embedded database tests
        run: node scripts/testing/embedded-database-tests.mjs ${{ matrix.group }}
      - name: Runtime unit tests
        if: matrix.group == 'remaining'
        run: pnpm --filter @use-brian/api-open exec vitest run src/runtime.test.ts

  department-isolation-shards:
    needs: [ci-scope, database-test-dependencies]
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: Department isolation (${{ matrix.shard }}/${{ needs.ci-scope.outputs.total }})${{ matrix.labelSuffix }}
    runs-on: ${{ matrix.runner }}
    # The suite registry budgets setup plus all serialized cases. Individual
    # SQL, test-turn and application/model deadlines remain unchanged.
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci-scope.outputs.matrix) }}
    steps:
      - *isolation-checkout
      - *isolation-pnpm
      - *isolation-node
      - *isolation-postgres
      - *isolation-install

      - name: Download database test dependencies
        uses: actions/download-artifact@v4
        with:
          name: database-test-dependencies-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Restore database test dependencies
        run: tar -xzf "$RUNNER_TEMP/database-test-dependencies.tgz"

      - *isolation-acceptance
      - *isolation-receipt

  department-isolation:
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository)
    name: Department isolation acceptance
    needs: [ci-scope, calendar-isolation, department-isolation-shards]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: department-isolation-shard-*
          path: ${{ runner.temp }}/department-isolation
          merge-multiple: true
      - name: Verify complete acceptance evidence
        run: >-
          node scripts/test-department-isolation.mjs
          --profile ${{ needs.ci-scope.outputs.profile }}
          --merge "${{ runner.temp }}/department-isolation"
          --report /tmp/department-isolation-report.json
      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: department-isolation-report
          path: /tmp/department-isolation-report.json
          if-no-files-found: error
      - name: Require every acceptance shard
        if: always()
        env:
          SHARD_RESULT: ${{ needs.department-isolation-shards.result }}
          CALENDAR_RESULT: ${{ needs.calendar-isolation.result }}
        run: test "$SHARD_RESULT" = success && test "$CALENDAR_RESULT" = success

  # Preserve the historical required-check context while making it depend on
  # every parallel lane. `always()` turns a failed dependency into a red
  # aggregate check instead of leaving the required check skipped.
  build-test:
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository)
    needs: [ci-scope, database-test-dependencies, embedded-current-tests, build-typecheck, api-tests, app-web-tests, offline-continuity, heavyweight-tests, remaining-tests, embedded-database-tests, department-isolation]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane
        env:
          SCOPE_RESULT: ${{ needs.ci-scope.result }}
          HISTORICAL: ${{ needs.ci-scope.outputs.historical }}
          EMBEDDED_CURRENT_RESULT: ${{ needs.embedded-current-tests.result }}
          DATABASE_BUILD_RESULT: ${{ needs.database-test-dependencies.result }}
          BUILD_TYPECHECK_RESULT: ${{ needs.build-typecheck.result }}
          API_TESTS_RESULT: ${{ needs.api-tests.result }}
          APP_WEB_TESTS_RESULT: ${{ needs.app-web-tests.result }}
          OFFLINE_CONTINUITY_RESULT: ${{ needs.offline-continuity.result }}
          HEAVYWEIGHT_TESTS_RESULT: ${{ needs.heavyweight-tests.result }}
          REMAINING_TESTS_RESULT: ${{ needs.remaining-tests.result }}
          EMBEDDED_DATABASE_TESTS_RESULT: ${{ needs.embedded-database-tests.result }}
          DEPARTMENT_ISOLATION_RESULT: ${{ needs.department-isolation.result }}
        run: |
          if [[ "$SCOPE_RESULT" != success ]]; then exit 1; fi
          if [[ "$HISTORICAL" == true ]]; then
            [[ "$EMBEDDED_DATABASE_TESTS_RESULT" == success && "$EMBEDDED_CURRENT_RESULT" == skipped ]] || exit 1
          elif [[ "$HISTORICAL" == false ]]; then
            [[ "$EMBEDDED_CURRENT_RESULT" == success && "$EMBEDDED_DATABASE_TESTS_RESULT" == skipped ]] || exit 1
          else exit 1
          fi
          if [[ "$DATABASE_BUILD_RESULT" != "success" ||
                "$BUILD_TYPECHECK_RESULT" != "success" ||
                "$API_TESTS_RESULT" != "success" ||
                "$APP_WEB_TESTS_RESULT" != "success" ||
                "$OFFLINE_CONTINUITY_RESULT" != "success" ||
                "$HEAVYWEIGHT_TESTS_RESULT" != "success" ||
                "$REMAINING_TESTS_RESULT" != "success" ||
                "$DEPARTMENT_ISOLATION_RESULT" != "success" ]]; then
            echo "CI lane failure: database_build=$DATABASE_BUILD_RESULT build=$BUILD_TYPECHECK_RESULT api=$API_TESTS_RESULT app_web=$APP_WEB_TESTS_RESULT offline=$OFFLINE_CONTINUITY_RESULT heavy=$HEAVYWEIGHT_TESTS_RESULT remaining=$REMAINING_TESTS_RESULT embedded=$EMBEDDED_DATABASE_TESTS_RESULT isolation=$DEPARTMENT_ISOLATION_RESULT"
            exit 1
          fi
