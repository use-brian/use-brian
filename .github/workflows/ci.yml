# Build + test the open core on every PR and on pushes to main/develop. Build
# runs before typecheck because some script-level typechecks reference their
# package's built dist. The largest test suites run on isolated workers so
# Turbo's package fan-out cannot multiply Vitest's own worker fan-out on one
# runner. Integration tests are intentionally excluded because they require
# provider credentials and self-skip on a secret-less runner.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# A newer push to the same ref cancels an in-flight run. Push and PR refs differ,
# so the job guards below separately suppress the duplicate develop -> main run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-typecheck:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # One end-to-end queryLoop turn against an in-memory mock provider.
      - name: Smoke
        run: pnpm smoke

      - name: Test release-evidence checks
        run: node --test scripts/__tests__/test-evidence.test.mjs scripts/__tests__/department-isolation-report.test.mjs

      # Discovery is report-only until complete journeys qualify ten candidates.
      # The required build-test gate still depends on complete test coverage.
      - name: Inventory selected test files (report-only)
        continue-on-error: true
        run: node scripts/testing/inventory.mjs --report "$RUNNER_TEMP/test-inventory.json"

      - name: Retain test inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-file-inventory
          path: ${{ runner.temp }}/test-inventory.json
          if-no-files-found: warn

  api-tests:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: Unit tests (@use-brian/api ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build test dependencies
        run: pnpm exec turbo run build --filter="@use-brian/api^..."

      - name: Unit tests
        run: pnpm --filter @use-brian/api exec vitest run --shard=${{ matrix.shard }}

  app-web-tests:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: Unit tests (app-web ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build test dependencies
        run: pnpm exec turbo run build --filter="app-web^..."

      - name: Unit tests
        run: pnpm --filter app-web exec vitest run --shard=${{ matrix.shard }}

  heavyweight-tests:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: Unit tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - "@use-brian/core"
          - "@use-brian/app-desktop"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo builds this package's dependency closure before its test task.
      - name: Unit tests
        run: pnpm exec turbo run test --filter="${{ matrix.package }}"

  remaining-tests:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: Unit tests (remaining packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: >-
          pnpm exec turbo run test
          --filter='!@use-brian/api'
          --filter='!@use-brian/core'
          --filter='!app-web'
          --filter='!@use-brian/app-desktop'
          --filter='!@use-brian/api-open'
          --concurrency=4

  embedded-database-tests:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: Embedded database tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build test dependencies
        run: pnpm exec turbo run build --filter="@use-brian/api-open^..."
      - name: Embedded database tests
        run: node scripts/testing/embedded-database-tests.mjs ${{ matrix.shard }}
      - name: Runtime unit tests
        if: matrix.shard == 3
        run: pnpm --filter @use-brian/api-open exec vitest run src/runtime.test.ts

  department-isolation-shards:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: Department isolation (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install PostgreSQL 18 with required extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-18-pgvector

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build test dependencies
        run: pnpm exec turbo run build --filter="@use-brian/api-open^..." --filter="app-web^..."

      - name: Run no-credential acceptance
        run: >-
          node scripts/test-department-isolation.mjs
          --pg-bin /usr/lib/postgresql/18/bin
          --shard ${{ matrix.shard }}/4
          --report /tmp/department-isolation-${{ matrix.shard }}.json

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: department-isolation-shard-${{ matrix.shard }}
          path: /tmp/department-isolation-${{ matrix.shard }}.json
          if-no-files-found: error

  department-isolation:
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository)
    name: Department isolation acceptance
    needs: [department-isolation-shards]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: department-isolation-shard-*
          path: ${{ runner.temp }}/department-isolation
          merge-multiple: true
      - name: Verify complete acceptance evidence
        run: >-
          node scripts/test-department-isolation.mjs
          --merge "${{ runner.temp }}/department-isolation"
          --report /tmp/department-isolation-report.json
      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: department-isolation-report
          path: /tmp/department-isolation-report.json
          if-no-files-found: error
      - name: Require every acceptance shard
        if: always()
        env:
          SHARD_RESULT: ${{ needs.department-isolation-shards.result }}
        run: test "$SHARD_RESULT" = success

  # Preserve the historical required-check context while making it depend on
  # every parallel lane. `always()` turns a failed dependency into a red
  # aggregate check instead of leaving the required check skipped.
  build-test:
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository)
    needs: [build-typecheck, api-tests, app-web-tests, heavyweight-tests, remaining-tests, embedded-database-tests, department-isolation]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane
        env:
          BUILD_TYPECHECK_RESULT: ${{ needs.build-typecheck.result }}
          API_TESTS_RESULT: ${{ needs.api-tests.result }}
          APP_WEB_TESTS_RESULT: ${{ needs.app-web-tests.result }}
          HEAVYWEIGHT_TESTS_RESULT: ${{ needs.heavyweight-tests.result }}
          REMAINING_TESTS_RESULT: ${{ needs.remaining-tests.result }}
          EMBEDDED_DATABASE_TESTS_RESULT: ${{ needs.embedded-database-tests.result }}
          DEPARTMENT_ISOLATION_RESULT: ${{ needs.department-isolation.result }}
        run: |
          if [[ "$BUILD_TYPECHECK_RESULT" != "success" ||
                "$API_TESTS_RESULT" != "success" ||
                "$APP_WEB_TESTS_RESULT" != "success" ||
                "$HEAVYWEIGHT_TESTS_RESULT" != "success" ||
                "$REMAINING_TESTS_RESULT" != "success" ||
                "$EMBEDDED_DATABASE_TESTS_RESULT" != "success" ||
                "$DEPARTMENT_ISOLATION_RESULT" != "success" ]]; then
            echo "CI lane failure: build=$BUILD_TYPECHECK_RESULT api=$API_TESTS_RESULT app_web=$APP_WEB_TESTS_RESULT heavy=$HEAVYWEIGHT_TESTS_RESULT remaining=$REMAINING_TESTS_RESULT embedded=$EMBEDDED_DATABASE_TESTS_RESULT isolation=$DEPARTMENT_ISOLATION_RESULT"
            exit 1
          fi
