# Build every deployable container on pull requests and publish images from
# trusted refs to the GitHub Container Registry.
name: Docker images

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/docker-images.yml"
      - "apps/api/**"
      - "apps/app-web/**"
      - "apps/auth-web/**"
      - "apps/browser-relay/**"
      - "apps/discord-connector/**"
      - "apps/doc-sync/**"
      - "apps/feishu-connector/**"
      - "apps/wa-connector/**"
      - "apps/wechat-connector/**"
      - "apps/wechat-desktop-bridge/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "turbo.json"
  push:
    branches: [main, develop]
    tags: ["v*"]
    paths:
      - ".dockerignore"
      - ".github/workflows/docker-images.yml"
      - "apps/api/**"
      - "apps/app-web/**"
      - "apps/auth-web/**"
      - "apps/browser-relay/**"
      - "apps/discord-connector/**"
      - "apps/doc-sync/**"
      - "apps/feishu-connector/**"
      - "apps/wa-connector/**"
      - "apps/wechat-connector/**"
      - "apps/wechat-desktop-bridge/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "turbo.json"

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.image }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            dockerfile: apps/api/Dockerfile
          - image: app-web
            context: .
            dockerfile: apps/app-web/Dockerfile
          - image: auth-web
            context: .
            dockerfile: apps/auth-web/Dockerfile
          - image: browser-relay
            context: .
            dockerfile: apps/browser-relay/Dockerfile
          - image: discord-connector
            context: .
            dockerfile: apps/discord-connector/Dockerfile
          - image: doc-sync
            context: .
            dockerfile: apps/doc-sync/Dockerfile
          - image: feishu-connector
            context: .
            dockerfile: apps/feishu-connector/Dockerfile
          - image: wa-connector
            context: .
            dockerfile: apps/wa-connector/Dockerfile
          - image: wechat-connector
            context: .
            dockerfile: apps/wechat-connector/Dockerfile
          - image: wechat-desktop-bridge
            context: apps/wechat-desktop-bridge
            dockerfile: apps/wechat-desktop-bridge/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          outputs: type=cacheonly
          build-args: ${{ matrix.image == 'app-web' && format('OSS_GIT_COMMIT_SHA={0}', github.sha) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  build:
    name: Build ${{ matrix.image }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            dockerfile: apps/api/Dockerfile
          - image: app-web
            context: .
            dockerfile: apps/app-web/Dockerfile
          - image: auth-web
            context: .
            dockerfile: apps/auth-web/Dockerfile
          - image: browser-relay
            context: .
            dockerfile: apps/browser-relay/Dockerfile
          - image: discord-connector
            context: .
            dockerfile: apps/discord-connector/Dockerfile
          - image: doc-sync
            context: .
            dockerfile: apps/doc-sync/Dockerfile
          - image: feishu-connector
            context: .
            dockerfile: apps/feishu-connector/Dockerfile
          - image: wa-connector
            context: .
            dockerfile: apps/wa-connector/Dockerfile
          - image: wechat-connector
            context: .
            dockerfile: apps/wechat-connector/Dockerfile
          - image: wechat-desktop-bridge
            context: apps/wechat-desktop-bridge
            dockerfile: apps/wechat-desktop-bridge/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          outputs: ${{ format('type=image,name=ghcr.io/{0}/{1},push-by-digest=true,name-canonical=true,push=true', github.repository_owner, matrix.image) }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: ${{ matrix.image == 'app-web' && format('OSS_GIT_COMMIT_SHA={0}', github.sha) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Export image digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - api
          - app-web
          - auth-web
          - browser-relay
          - discord-connector
          - doc-sync
          - feishu-connector
          - wa-connector
          - wechat-connector
          - wechat-desktop-bridge

    steps:
      - name: Download image digest
        uses: actions/download-artifact@v4
        with:
          name: digest-${{ matrix.image }}
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publish image tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          digest=$(basename /tmp/digests/*)
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "$IMAGE@sha256:$digest"
