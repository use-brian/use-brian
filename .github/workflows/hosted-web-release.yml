name: Hosted web release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-web-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'use-brian/use-brian' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enqueue hosted app-web production build
        env:
          HOSTED_APP_WEB_DEPLOY_HOOK: ${{ secrets.HOSTED_APP_WEB_DEPLOY_HOOK }}
        run: node scripts/trigger-hosted-web-release.mjs
