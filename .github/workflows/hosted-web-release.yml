name: Hosted web release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'use-brian/use-brian' && github.ref == 'refs/heads/main'
    concurrency:
      group: hosted-web-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enqueue hosted app-web production build
        env:
          HOSTED_APP_WEB_DEPLOY_HOOK: ${{ secrets.HOSTED_APP_WEB_DEPLOY_HOOK }}
        run: node scripts/trigger-hosted-web-release.mjs

  verify:
    needs: deploy
    concurrency:
      group: hosted-web-production-verification
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the OSS revision served by the production alias
        run: node scripts/trigger-hosted-web-release.mjs --verify "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
